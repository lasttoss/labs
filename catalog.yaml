    verify: "cd ../agent-harness-lab && cat docs/COST-PER-TASK.md"
    tags: [cost, ai-harness, measurement, orchestration]
    themes: [ai-as-infrastructure, correctness-that-blocks]
    status: flagship
    repo: "https://github.com/lasttoss/agent-harness-lab"
    visibility: public

